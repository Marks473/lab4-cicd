<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детали задачи</title>
</head>
<body>
    <h1>Детали задачи</h1>

    <p><strong>Имя файла:</strong> {{ task.filename }}</p>
    <p><strong>Исходный формат:</strong> {{ task.source_format }}</p>
    <p><strong>Целевой формат:</strong> {{ task.target_format }}</p>
    <p><strong>Битрейт:</strong> {{ task.bitrate }}</p>
    <p><strong>Каналы:</strong> {{ task.channels }}</p>
    <p><strong>Статус:</strong> {{ task.status }}</p>
    <p><strong>Дата создания:</strong> {{ task.created_at }}</p>

    <a href="{% url 'task_update' task.pk %}">Редактировать</a>
    <a href="{% url 'task_delete' task.pk %}">Удалить</a>
    <a href="{% url 'task_list' %}">Назад к списку</a>
</body>
</html>
